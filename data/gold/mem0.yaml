    confidence: 0.91
    requirements: [docker, postgres]
  - id: m7
    name: Semantic deduplication by hash
    ontology_type: EVALUATOR
    evidence:
      - file: mem0/memory/main.py
        scope: hash-based dedup on add (id/hash fields in payload)
    confidence: 0.85
    requirements: []
  - id: m8
    name: Agent/editor integrations (MCP + plugins)
    ontology_type: ADAPTER
    evidence:
      - file: integrations/mem0-plugin
        scope: Claude Code/Cursor/Codex MCP plugin
      - file: integrations/vercel-ai-sdk
        scope: Vercel AI SDK provider
    confidence: 0.86
    requirements: [host-app]

dependencies_permissions:
  dependencies: [qdrant-client, pydantic, openai, httpx, posthog, pytz, sqlalchemy, protobuf]
  permissions:
    filesystem: none-required-for-core
    network: llm-and-embedding-apis
    shell: none
  security_posture: telemetry via posthog (MEM0_TELEMETRY=false to disable);
    server auth via ADMIN_API_KEY/JWT (AUTH_DISABLED for local dev only)

non_capabilities:
  - not-an-agent-runtime (memory layer only — no agent loop)
  - not-a-chatbot
  - not-a-vector-database-itself (uses external stores)
  - v2.0.x does-not-do-graph-memory (graphs/ absent in this version)
  - hosted-platform features differ from OSS SDK surface

risks_findings:
  - LLM extraction depends on an external paid/free model — cost and quota sensitive
  - posthog telemetry collects anonymous usage — disable in production
  - server auth: AUTH_DISABLED=true is for local dev only; production requires admin key
  - embedding dims must match vector store config (1536 vs 768 mismatch caused
    insert failures — seen live 2026-08-05, fixed via embedding_model_dims=768)

evaluation_plan: |
  Parity test: a non-technical user, using only HURCULES' mem0 capability template,
  configures a self-hosted mem0 instance (LLM via free route, embeddings via local
  ollama, pgvector store) and successfully stores + semantically searches a memory —
  as well as an engineer doing the same directly.
  Checks: add returns extracted memory (infer path), search returns relevant hit,
  dedup by hash works, server + dashboard healthy.