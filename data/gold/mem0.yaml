        scope: pgvector, qdrant, chroma, faiss, milvus, weaviate, elasticsearch, mongodb, redis, pinecone, valkey, cassandra, opensearch, supabase, upstash, databricks, azure (4), mysql, s3, neptune, turbopuffer, baidu
    confidence: 0.90
