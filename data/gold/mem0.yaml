gold_case_id: mem0
reviewer: the product owner + Hermes
status: HUMAN-VERIFIED-GOLD
date: 2026-08-05

# Gold-Standard: mem0 (mem0ai/mem0)
# HURCULES Stage 1 — Gold case #2 (agent-framework + Python library categories)

provenance:
  repository: mem0ai/mem0 (local clone of upstream, modified by bozo)
  commit_sha: 4e448269bcf7136905b45c0ef5ac34c2254a1a3b
  local_clone: ~/projects/mem0
  version: 2.0.7 (pyproject; server installs mem0ai 2.0.16)
  license: Apache-2.0 — permissive, safe to adapt (patent grant included)
  languages: [Python, TypeScript, MDX]
  runtime: Python 3.9+; server on FastAPI + PostgreSQL/pgvector

purpose: |
  Mem0 ("mem-zero") is an intelligent memory layer for AI agents: persistent,
  personalized memory via a hosted platform API and self-hosted open-source SDKs.
  It extracts, stores, and retrieves memories (facts about users/agents) using an
  LLM for extraction + an embedding model + a vector store. (README.md, AGENTS.md)

architecture_map: |
  Polyglot monorepo: mem0/ (core Python SDK), mem0-ts/ (TypeScript SDK),
  server/ (FastAPI REST server, Docker: PostgreSQL/pgvector), cli/ (Python+Node
  CLIs), integrations/ (mem0-plugin, openclaw, pi-agent-plugin, vercel-ai-sdk),
  openmemory/ (self-hosted platform), docs/, tests/ (95 test files).

capabilities:
  - id: m1
    name: Memory CRUD (add/search/get_all/update/delete/reset)
    ontology_type: TOOL
    evidence:
