        scope: add (line 653), search (1243), get_all (1128), update (380), delete_all (1715), reset (1929)
    confidence: 0.95
    requirements: [llm-provider, embedding-model, vector-store]
  - id: m2
    name: Pluggable LLM provider layer (18 providers)
    ontology_type: ADAPTER
    evidence:
      - file: mem0/llms
        scope: openai, anthropic, deepseek, gemini, groq, ollama, vllm, litellm, xai, minimax, together, bedrock, azure, lmstudio, langchain, sarvam
    confidence: 0.93
    requirements: [provider-specific-keys, or local (ollama/lmstudio/vllm)]
  - id: m3
    name: Pluggable embedding provider layer (14 providers)
    ontology_type: ADAPTER
    evidence:
      - file: mem0/embeddings
        scope: openai, ollama, huggingface, fastembed, gemini, bedrock, azure, together, vertexai, aws, lmstudio, langchain, mock
    confidence: 0.92
