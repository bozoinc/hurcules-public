purpose: 'The evaluation corpus: ~20 deliberately varied repositories, each pinned
  to a

  commit, with HUMAN-VERIFIED correct findings (purpose, architecture, real

  capabilities with evidence, deps, permissions, licence, security notes).

  This is what the engine is scored against.

  '
scoring_rubric:
  evidence_validity: percentage of cited file+line ranges that support the claim (target
    >= 95%)
  capability_precision: percentage of generated capabilities judged materially present
    (target >= 85%)
  unsupported_capability_rate: percentage of approved capabilities with no implementation
    evidence (target < 5%)
  reproducibility: same commit -> structurally equivalent output (target 100%)
