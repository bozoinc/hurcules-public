purpose: |
  hexyl is a simple hex viewer for the terminal: byte-by-byte hexdump with
  colored ASCII/hex output, position markers, and optional piped input.

architecture_map: |
  Rust project: src/ (main.rs entry, lib.rs, input.rs stdin handling, colors.rs
  output coloring), Cargo.toml. Apache/MIT dual.

capabilities:
  - id: h1
    name: Hexdump rendering (hex + ASCII + colors)
    ontology_type: TOOL
    evidence:
      - file: src/lib.rs
        scope: hexdump layout/rendering
      - file: src/colors.rs
        scope: colored output
    confidence: 0.92
    requirements: []
  - id: h2
    name: File + stdin input handling
    ontology_type: TOOL
    evidence:
      - file: src/input.rs
        scope: input sources
      - file: src/main.rs
        scope: CLI entry
    confidence: 0.88
    requirements: []

dependencies_permissions:
  dependencies: [ansi-term, rayon-optional]
  permissions:
    filesystem: read-files
    network: none
    shell: none
  security_posture: reads bytes, renders only; no execution

non_capabilities:
