gold_case_id: archon
reviewer: the product owner + Hermes
status: HUMAN-VERIFIED-GOLD
date: 2026-08-05

# Gold-Standard: Archon (coleam00/Archon)
# HURCULES Stage 1 — Gold case #1

provenance:
  repository: coleam00/Archon
  commit_sha: cbeab968bacb0a6fefb65f3fef1d1415302b32f5
  local_clone: ~/projects/Archon
  version: 0.7.1
  license: MIT (Copyright (c) 2025-2026 Cole Medin) — permissive, safe to adapt
  languages: [TypeScript, MDX, shell]
  runtime: Bun (Node-compatible) + PostgreSQL/SQLite

purpose: |
  Archon is a workflow engine for AI coding agents. Define development processes as
  YAML workflows (plan → implement → validate → review → PR) run deterministically
  and repeatably across projects. "What Dockerfiles did for infrastructure and
  GitHub Actions did for CI/CD, Archon does for AI coding workflows." (README.md)
  A remote agentic coding platform controlling AI coding assistants from Slack,
  Telegram, and GitHub (AGENTS.md).

architecture_map: |
  Monorepo (Bun workspaces) with 11 packages:
  - packages/core — workflow operations, isolation ops (core/src/operations/)
  - packages/workflows — DAG workflow engine (dag-executor.ts 8409 lines; schemas/dag-node.ts 1156)
  - packages/providers — agent provider registry (claude, codex, community, mcp)
  - packages/isolation — sandbox backends (container, worktree), PKCE/oauth
  - packages/git — git repo + worktree management (repo.ts, worktree.ts 398 lines)
  - packages/adapters — platform adapters (chat, forge, community)
  - packages/cli — entry point (cli.ts)
  - packages/server, packages/web, packages/docs-web, packages/paths

capabilities:
  - id: c1
    name: YAML Workflow Engine (DAG)
    ontology_type: WORKFLOW
    evidence:
      - file: packages/workflows/src/schemas/dag-node.ts
        scope: loop/loop_group/interactive/context node schema
      - file: packages/workflows/src/dag-executor.ts
        scope: DAG execution runtime
      - file: packages/workflows/src/loader.ts
        scope: parse + validate DAG structure
    confidence: 0.95
    requirements: [bun, agent-provider-credentials]
  - id: c2
    name: Multi-Agent Provider Registry
    ontology_type: ADAPTER
    evidence:
      - file: packages/providers/src/registry.ts
        scope: registerBuiltinProviders / registerCommunityProviders
      - file: packages/providers/src/claude
        scope: Claude provider
      - file: packages/providers/src/codex
        scope: Codex provider
      - file: packages/providers/src/community
        scope: opencode, pi, copilot community providers
    confidence: 0.92
    requirements: [per-provider-api-keys]
  - id: c3
    name: Sandboxed Execution / Isolation
    ontology_type: POLICY
    evidence:
