        scope: isolation factory
      - file: packages/isolation/src/backends/container.ts
        scope: container backend
      - file: packages/isolation/src/providers/worktree.ts
        scope: git worktree provider
    confidence: 0.90
    requirements: [git, optional-docker]
  - id: c4
    name: Deterministic Workflow Validation
