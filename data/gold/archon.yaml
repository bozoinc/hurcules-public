    confidence: 0.93
    requirements: []
  - id: c5
    name: Cross-Platform Adapters
    ontology_type: ADAPTER
    evidence:
      - file: packages/adapters/src/chat
        scope: chat adapter
      - file: packages/adapters/src/forge
        scope: forge adapter
      - file: packages/adapters/src/community
        scope: community adapters
    confidence: 0.88
    requirements: []
  - id: c6
    name: Human Approval Gates in Workflows
    ontology_type: POLICY
    evidence:
      - file: packages/workflows/src/schemas/loop.ts
        scope: interactive + gate_message loop control
    confidence: 0.90
    requirements: []

dependencies_permissions:
  dependencies: ["@anthropic-ai/claude-agent-sdk", "@opencode-ai/sdk", "bun", "optional-docker"]
  permissions:
    filesystem: repo-read-write-in-worktrees
    network: upstream-llm-apis
    shell: bash-nodes
    git: branch-and-worktree-ops
  security_posture: repositories not auto-trusted; real sandbox boundary (isolation), not system-prompt promise

non_capabilities:
  - not-a-general-chatbot
  - not-a-model-itself
  - v0.7.1-does-not-auto-spawn-production-agents-at-scale
  - not-a-full-CI-system

risks_findings:
  - bash nodes execute from workflows — MUST run in sandbox/worktree; untrusted workflow YAML could be dangerous
  - provider credentials (claude/codex keys) are powerful — scope per workflow
  - container isolation requires Docker present

evaluation_plan: |
  Parity test (D2/D6): a non-technical user, using only HURCULES' Archon capability
  template, defines a YAML workflow and runs it end-to-end producing a valid
  DAG-executed result — as well as an engineer using Archon directly.
  Checks: workflow loads (loader validation=100%), executes (dag-executor),
  isolation active (worktree), human approval gate honored.